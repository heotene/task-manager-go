{{define "content"}}

<section class="dashboard">

    <h1>Dashboard</h1>

    <p class="welcome">
        Welcome back,
        <strong>{{.User.FullName}}</strong> 👋
    </p>

    <div class="stats">

        <div class="stat-card total">
            <h3>Total Tasks</h3>
            <h1>{{.TotalTasks}}</h1>
        </div>

        <div class="stat-card completed">
            <h3>Completed</h3>
            <h1>{{.CompletedTasks}}</h1>
        </div>

        <div class="stat-card pending">
            <h3>Pending</h3>
            <h1>{{.PendingTasks}}</h1>
        </div>

    </div>

    <div class="dashboard-actions">

        <a href="/tasks" class="btn">
            📋 View Tasks
        </a>

        <a href="/tasks/new" class="btn btn-success">
            ➕ New Task
        </a>

    </div>

</section>

{{end}}
