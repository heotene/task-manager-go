{{define "content"}}

<div class="auth-container">


    <div class="auth-card">


        <h1>
            ➕ Create New Task
        </h1>
        {{if .Error}} <div class="form-error"> ⚠️ {{.Error}} </div> {{end}}

        <p class="auth-subtitle">
            Add a new task to your workspace
        </p>





        <form method="POST" action="/tasks/new">



            <label>
                📝 Task Title
            </label>


            <input
                type="text"
                name="title"
                placeholder="Enter task title"
                required
            >






            <label>
                📄 Description
            </label>


            <textarea
                name="description"
                rows="5"
                placeholder="Describe your task..."
            ></textarea>








            <label>
                🔥 Priority
            </label>


            <select name="priority">


                <option value="High">
                    🔴 High
                </option>


                <option value="Medium">
                    🟡 Medium
                </option>


                <option value="Low">
                    🟢 Low
                </option>


            </select>








            <label>
                📂 Category
            </label>


            <select name="category">


                <option value="Work">
                    💼 Work
                </option>


                <option value="Study">
                    📚 Study
                </option>


                <option value="Personal">
                    🏠 Personal
                </option>


            </select>








            <label>
                📅 Due Date
            </label>


            <input
                type="date"
                name="due_date"
            >









            <button 
            type="submit"
            class="btn auth-btn">

                ✅ Create Task

            </button>





        </form>





    </div>



</div>


{{end}}
